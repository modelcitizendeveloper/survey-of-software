baseURL = 'https://research.modelcitizendeveloper.com/'
languageCode = 'en-us'
title = 'Survey of Software - Research Library'
theme = 'hugo-book'
copyright = '© 2026 Ivan Schneider · <a href="https://modelcitizendeveloper.com/">Model Citizen Developer</a> · Licensed under <a href="/license/">CC BY 4.0</a>'

# Book theme specific config
[params]
  # Buttondown newsletter handle — the account name in the subscribe URL
  # (https://buttondown.com/<handle>). Drives the capture form in
  # layouts/partials/newsletter-cta.html, which renders NOTHING while this is
  # unset, so the site is always safe to deploy. Set it and every survey page
  # starts capturing on the next build.
  #
  # This is the MCD newsletter on the paid multi-newsletter tier — NOT the
  # Convention City Dispatch handle. Those lists stay separate on purpose.
  buttondownUsername = "model-citizen-developer"

  # Show page navigation and menu
  BookShowPageHeader = true
  BookMenuHeader = true
  BookMenu = true
  BookToC = 3

  # Follow the reader's OS setting. This is a long-form reference library and
  # people read it the way they read everything else, so it is the one Model
  # Citizen Developer surface that does not pick for them — the Flask surfaces
  # (hub, newsletter, commons, talks) are dark unconditionally. 'auto' emits
  # theme-light plus theme-dark inside prefers-color-scheme: dark; the dark side
  # is overridden to the MCD palette in assets/_custom.scss.
  BookTheme = 'auto'

  # Specify section of content to render as menu
  BookSection = 'survey'

  # Enable search
  BookSearch = true

# Disable taxonomy (not needed for documentation)
disableKinds = ['taxonomy', 'taxonomyTerm']

# Enable HTML in Markdown (for details/summary tabs)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.after]]
    name = "What is this?"
    url = "/about/"
    weight = 1

  [[menu.after]]
    name = "The Vision"
    url = "/vision/"
    weight = 2

  [[menu.after]]
    name = "Method"
    url = "/survey/method"
    weight = 3

  [[menu.after]]
    name = "GitHub"
    url = "https://github.com/modelcitizendeveloper/survey-of-software"
    weight = 10

# ── SEO: noindex the generated survey leaves, keep the trunk indexable ──
# Google declined to index ~145 of the long generated survey pages (scaled-content
# judgment). Strategy: noindex every /survey/<leaf>, keep the trunk (home, vision,
# about, skill, license, the /survey/ index, method, taxonomy) in the index.
# method.md and taxonomy-1.3xx-vision.md override this with `noindex: false`.
[[cascade]]
  [cascade.params]
    noindex = true
  [cascade._target]
    path = '/survey/**'
    kind = 'page'
